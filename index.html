<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gridlock Blocks</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0f14; overflow: hidden; }
    #hud {
      position: fixed; top: 12px; left: 12px;
      color: #e8ecf1; font-family: ui-monospace, monospace; font-size: 14px;
      background: rgba(14,18,24,0.72); padding: 8px 12px; border-radius: 8px;
      pointer-events: none;
    }
    #daynight {
      position: fixed; top: 12px; right: 12px; z-index: 5;
      width: 44px; height: 44px; border-radius: 10px; border: 0; font-size: 22px;
      background: rgba(14,18,24,0.72); color: #fff; cursor: pointer; touch-action: manipulation;
    }
    #minimap {
      position: fixed; left: 12px; bottom: 12px; z-index: 4; pointer-events: auto; cursor: pointer;
      border-radius: 10px; border: 2px solid rgba(255,255,255,0.85);
      box-shadow: 0 2px 14px rgba(0,0,0,0.55);
    }
    html.touch #minimap { bottom: 140px; width: 160px !important; height: 110px !important; }
    #loading {
      position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: radial-gradient(ellipse at center, #14304a, #060b12); color: #cfe8ff; font-family: ui-monospace, monospace;
      transition: opacity .5s; touch-action: none;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading h1 { margin: 0; font-size: 34px; letter-spacing: 2px; text-shadow: 0 0 18px rgba(80,160,255,.85); }
    #loadingTrack { position: relative; width: min(70vw, 420px); height: 14px; border-radius: 8px; background: rgba(255,255,255,.12); overflow: hidden; }
    #loadingBar { height: 100%; width: 0; background: linear-gradient(90deg, #2f9bff, #7ed8ff); border-radius: 8px; transition: width .35s ease-out; }
    #loadingShine { position: absolute; top: 0; left: 0; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); animation: lshine 1.2s linear infinite; }
    @keyframes lshine { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    #loadingInfo { display: flex; justify-content: space-between; width: min(70vw, 420px); font-size: 13px; opacity: .85; }
    #splash {
      display: none;
      position: fixed; inset: 0;
      align-items: center; justify-content: center;
      color: #cfe8ff; font-family: ui-monospace, monospace;
      font-size: 42px; font-weight: bold; letter-spacing: 1px;
      text-shadow: 0 0 18px rgba(80,160,255,0.85), 0 2px 6px rgba(0,0,0,0.8);
      background: radial-gradient(ellipse at center, rgba(10,30,50,0.35), rgba(5,10,16,0.75));
      pointer-events: none;
    }
    #wrongway {
      display: none;
      position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
      color: #ffdede; font-family: ui-monospace, monospace;
      font-size: 24px; font-weight: bold; letter-spacing: 2px;
      padding: 8px 20px; border-radius: 6px;
      background: rgba(150, 10, 10, 0.78);
      box-shadow: 0 0 20px rgba(220,30,30,0.7);
      pointer-events: none;
    }
    /* The tunnel between two cities (travel.js): drawn over everything while one city is swapped for the other. All of it moves by CSS
       transform/opacity animation, which the browser runs off the main thread, so it keeps moving while the next city is being built. */
    #tunnel { position: fixed; inset: 0; z-index: 60; display: none; overflow: hidden; pointer-events: none;
      background: radial-gradient(ellipse at 50% 46%, #1a120b 0%, #07080a 46%, #020203 100%); }
    html.travel #tunnel { display: block; animation: tunIn .75s ease-out both; }
    html.travel-out #tunnel { animation: tunOut 1.3s ease-in both; }
    html.travel #loading { display: none; }
    #tunnel i { position: absolute; left: 50%; top: 46%; width: 150vmax; height: 84vmax; margin: -42vmax 0 0 -75vmax;
      border-radius: 46% 46% 4% 4% / 70% 70% 4% 4%; opacity: 0; will-change: transform, opacity;
      box-shadow: inset 0 1.1vmax 0 -0.2vmax rgba(255, 170, 80, .85), inset 0 0 0 .35vmax rgba(120, 90, 60, .35), inset 0 3vmax 6vmax rgba(255, 140, 50, .22);
      animation: tunRib 1.5s cubic-bezier(.6, .02, .95, .45) infinite; }
    #tunnel i:nth-child(2) { animation-delay: -.1875s; } #tunnel i:nth-child(3) { animation-delay: -.375s; } #tunnel i:nth-child(4) { animation-delay: -.5625s; }
    #tunnel i:nth-child(5) { animation-delay: -.75s; } #tunnel i:nth-child(6) { animation-delay: -.9375s; } #tunnel i:nth-child(7) { animation-delay: -1.125s; } #tunnel i:nth-child(8) { animation-delay: -1.3125s; }
    #tunnel b { position: absolute; left: 50%; top: 46%; width: .6vmax; height: 60vmax; margin-left: -.3vmax; opacity: 0; transform-origin: 50% 0;
      background: linear-gradient(rgba(255,255,255,0), rgba(235,235,225,.5)); animation: tunLine .5s linear infinite; }
    #tunnelText { position: absolute; left: 0; right: 0; bottom: max(26px, env(safe-area-inset-bottom)); text-align: center; color: #ffc27a;
      font: 700 13px ui-monospace, monospace; letter-spacing: .32em; text-transform: uppercase; text-shadow: 0 0 12px rgba(255, 150, 60, .7); }
    @keyframes tunIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes tunOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes tunRib { 0% { transform: scale(.02); opacity: 0; } 12% { opacity: .95; } 100% { transform: scale(1.5); opacity: .25; } }
    @keyframes tunLine { 0% { transform: translateY(1vmax) scaleY(.05); opacity: 0; } 30% { opacity: .7; } 100% { transform: translateY(26vmax) scaleY(1); opacity: 0; } }
  </style>
  <script>try { if (sessionStorage.getItem('gridlock-travel')) document.documentElement.classList.add('travel'); } catch (e) {}</script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="theme-color" content="#1e222c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <div id="hud">Speed <span id="speed">0</span><br>
    <small>WASD/arrows drive &middot; Space/Down brake &middot; L lights &middot; O/P indicators &middot; N day/night &middot; C cruise &middot; M city map &middot; Esc menu</small>
  </div>
  <div id="fps" style="position:fixed;top:8px;left:50%;transform:translateX(-50%);font:12px monospace;color:#fff;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:6px;z-index:5;pointer-events:none"></div>
  <button id="daynight" tabindex="-1" aria-label="Toggle day and night">🌙</button>
  <div id="loading"><h1>GRIDLOCK BLOCKS</h1><div id="loadingTrack"><div id="loadingBar"></div><div id="loadingShine"></div></div><div id="loadingInfo"><span id="loadingLabel">Starting...</span><span id="loadingPct">0%</span></div></div>
  <div id="tunnel" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><b></b><div id="tunnelText">Interstate 80</div></div>
  <div id="splash"></div>
  <div id="wrongway">WRONG WAY</div>
  <script type="module" src="/src/main.js"></script>
  <script>if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body>
</html>
